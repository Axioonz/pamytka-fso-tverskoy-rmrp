name: Обновить законы RMRP
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rmrp-laws-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить библиотеки
        run: python -m pip install -r tools/requirements.txt
      - name: Проверить форум и обновить тексты
        run: python tools/update_laws.py
      - name: Показать результат проверки
        if: always()
        run: |
          if [ -f laws-data/last-check.txt ]; then cat laws-data/last-check.txt; fi
      - name: Опубликовать проверенные тексты
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws-data/
          if git diff --cached --quiet; then
            echo 'Новых изменений нет.'
          else
            git commit -m 'Обновление законодательства RMRP'
            git push
          fi
