/*
  Памятка ФСО / RMRP — Тверской
  PNG-файлы добавляются вручную в папку assets/:
    assets/logo.png          256 × 256 px  (прозрачный логотип в шапке)
    assets/hero-bg.png      1600 × 1200 px (фон слева, место для текста)
    assets/situations.png   1000 × 1000 px (высокая карточка)
    assets/reference.png    1200 × 600 px  (правовая карточка)
    assets/detention.png    1200 × 600 px  (карточка задержания)
  Файлы не обязательны: без них сайт выглядит завершённым.
  Изображения в CSS устанавливаются через background-size:cover и могут обрезаться.
*/
:root {
 color-scheme:dark;
 --bg:#0d1219; --surface:#151e28; --surface2:#192634; --rail-bg:#0a1118;
 --line:#2a3b4b; --line-hover:#5b829f; --text:#eef4fa; --muted:#a4b2c0;
 --faint:#8194a7; --accent:#a9cbe8; --accent-strong:#7cb7e7; --accent-text:#102233;
 --accent-wash:rgba(99,146,185,.14); --input-bg:rgba(30,45,58,.88);
 --intro-image-shade:linear-gradient(90deg,rgba(13,18,25,.94),rgba(13,18,25,.83) 48%,rgba(13,18,25,.64));
 --card-shade:linear-gradient(90deg,rgba(19,28,38,.97),rgba(19,28,38,.78) 67%,rgba(19,28,38,.59));
 --card-shade-tall:linear-gradient(180deg,rgba(21,33,45,.95),rgba(17,28,39,.82) 70%,rgba(17,28,39,.67));
 --focus-ring:#8dc5ec; --shadow:0 17px 45px rgba(0,0,0,.25);
}
html[data-theme="light"] {
 color-scheme:light;
 --bg:#eef3f8; --surface:#ffffff; --surface2:#f3f7fb; --rail-bg:#e8f0f7;
 --line:#cbd9e5; --line-hover:#6f9bbc; --text:#142333; --muted:#526779;
 --faint:#60778b; --accent:#326f9e; --accent-strong:#216b9e; --accent-text:#ffffff;
 --accent-wash:rgba(74,125,169,.12); --input-bg:#ffffff;
 --intro-image-shade:linear-gradient(90deg,rgba(238,243,248,.98),rgba(238,243,248,.91) 48%,rgba(238,243,248,.74));
 --card-shade:linear-gradient(90deg,rgba(255,255,255,.97),rgba(255,255,255,.87) 68%,rgba(255,255,255,.67));
 --card-shade-tall:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,250,254,.87) 70%,rgba(239,246,252,.7));
 --focus-ring:#3478a9; --shadow:0 15px 35px rgba(32,71,105,.10);
}
* ,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{min-width:320px;scroll-behavior:smooth}
body{min-width:320px;min-height:100vh;margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input{font:inherit}button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.icon{width:23px;height:23px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Единственная навигационная панель находится слева; раскрывается поверх содержимого. */
.rail{position:fixed;z-index:30;inset:0 auto 0 0;width:76px;background:var(--rail-bg);border-right:1px solid var(--line);padding:28px 12px 18px;display:flex;flex-direction:column;gap:18px;overflow:hidden;transition:width .23s cubic-bezier(.2,.7,.2,1),background .2s;box-shadow:none}
.rail:hover,.rail:focus-within,.rail.expanded{width:262px;box-shadow:var(--shadow)}
.rail-top{height:30px;display:flex;align-items:center;gap:17px;padding:0 12px;white-space:nowrap;color:var(--faint);font-weight:750;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.rail-top .icon{width:23px;height:23px;color:var(--accent)}
.rail-top span{opacity:0;transform:translateX(4px);transition:opacity .15s,transform .15s}
.rail:hover .rail-top span,.rail:focus-within .rail-top span,.rail.expanded .rail-top span{opacity:1;transform:none}
.rail-nav{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.rail-button,.theme-toggle{display:flex;align-items:center;gap:16px;width:100%;height:52px;flex:none;padding:0 12px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--faint);text-align:left;transition:background .17s,color .17s,border-color .17s}
.rail-button:hover,.theme-toggle:hover{background:var(--accent-wash);color:var(--text)}
.rail-button.active{background:var(--accent-wash);border-color:var(--line-hover);color:var(--accent-strong)}
.rail-button span,.theme-toggle span{display:block;flex:1;white-space:nowrap;overflow:hidden;opacity:0;transition:opacity .12s}
.rail:hover .rail-button span,.rail:hover .theme-toggle span,.rail:focus-within .rail-button span,.rail:focus-within .theme-toggle span,.rail.expanded .rail-button span,.rail.expanded .theme-toggle span{opacity:1}
.rail-bottom{display:grid;gap:7px;margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.rail-theme .moon,.rail-theme .sun{display:none}
html[data-theme="dark"] .rail-theme .sun,html[data-theme="light"] .rail-theme .moon{display:block}
/* Основная сетка B: текст слева, 3 карточки справа */
.app{margin-left:76px;min-height:100vh}
.container{max-width:1640px;margin:0 auto;padding-right:clamp(26px,3.5vw,58px);padding-left:clamp(26px,3.5vw,58px)}
.topbar{min-height:112px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:37px;height:37px;flex:none;border:1px solid var(--line);border-radius:11px;background:var(--surface2) url('./assets/logo.png') center/contain no-repeat;display:grid;place-items:center;color:var(--accent)}
.brand-mark.has-image .icon{display:none}
.brand-title{font-size:15px;letter-spacing:.02em;font-weight:760;white-space:nowrap}
.top-hint{color:var(--faint);font-size:12px;text-align:right;white-space:nowrap}
.home-screen{padding-top:54px;padding-bottom:52px}
.home-grid{display:grid;grid-template-columns:minmax(370px,.98fr) minmax(560px,1.25fr);gap:clamp(38px,5vw,90px)}
.intro{min-height:525px;position:relative;isolation:isolate;padding-top:12px}
.intro::before{content:"";position:absolute;z-index:-1;inset:8px -4px 38px -24px;border-radius:10px;background-image:var(--intro-image-shade),url('./assets/hero-bg.png');background-position:center,center right;background-repeat:no-repeat;background-size:cover;pointer-events:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.21em;font-weight:770;color:var(--accent)}
.intro h1{font-size:clamp(58px,5.1vw,82px);letter-spacing:-.075em;line-height:1.04;font-weight:775;margin:29px 0 21px}
.intro h1 strong{font-weight:inherit;color:var(--accent)}
.intro-desc{max-width:390px;color:var(--muted);font-size:17px;line-height:1.7;margin:0 0 40px}
.search{width:min(490px,100%);min-height:60px;display:flex;align-items:center;gap:12px;background:var(--input-bg);border:1px solid var(--line);border-radius:11px;padding:8px 9px 8px 17px;transition:border-color .18s}
.search:focus-within{border-color:var(--accent-strong)}
.search .icon{width:19px;height:19px;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}
.search input::placeholder{color:var(--faint)}
.search button{background:var(--accent);color:var(--accent-text);padding:11px 16px;min-width:85px;font-weight:750;font-size:12px;border:0;border-radius:8px;transition:filter .18s}
.search button:hover{filter:brightness(1.08)}
.search-hint{color:var(--faint);font-size:11px;min-height:19px;margin:10px 0 0 2px}
.search-results{width:min(490px,100%);display:grid;gap:6px;margin-top:11px}
.search-results button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;text-align:left;font-size:12px}
.search-results button:hover{border-color:var(--line-hover)}
.features{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:15px;min-height:435px}
.feature{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;isolation:isolate;overflow:hidden;padding:26px 26px 23px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:transform .18s,border-color .18s,box-shadow .18s}
.feature:hover{transform:translateY(-2px);border-color:var(--line-hover);box-shadow:var(--shadow)}
.feature::before{content:"";position:absolute;z-index:-2;inset:0;background-position:center;background-repeat:no-repeat;background-size:cover;opacity:.49}
.feature::after{content:"";position:absolute;z-index:-1;inset:0;background:var(--card-shade)}
.feature-situations{grid-row:span 2}
.feature-situations::before{background-image:url('./assets/situations.png')}
.feature-reference::before{background-image:url('./assets/reference.png')}
.feature-detention::before{background-image:url('./assets/detention.png')}
.feature-situations::after{background:var(--card-shade-tall)}
.feature .number{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.15em}
.feature h2{font-size:clamp(28px,2.55vw,39px);line-height:1.17;font-weight:740;letter-spacing:-.053em;margin:22px 0 11px}
.feature p{max-width:290px;color:var(--muted);font-size:13px;margin:0;line-height:1.55}
.feature .arrow{margin-top:auto;display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:760;font-size:12px;padding-top:16px}
.feature .arrow .icon{width:16px;height:16px}
.feature-situations .ghost-number{position:absolute;z-index:-1;right:8px;bottom:-40px;font-size:220px;line-height:1;font-weight:850;letter-spacing:-.12em;color:var(--accent-wash);pointer-events:none}
/* Простые служебные разделы. Не выдаём демонстрационный текст за закон. */
.subpage{padding:63px 0 120px;max-width:980px}
.back{border:0;background:none;color:var(--accent-strong);font-size:13px;font-weight:700;padding:7px 0}
.subpage h1{font-size:clamp(44px,5vw,70px);line-height:1.08;letter-spacing:-.058em;margin:28px 0 12px}
.subpage-desc{color:var(--muted);font-size:16px;max-width:650px}
.empty-panel{margin-top:36px;padding:34px;border:1px solid var(--line);border-radius:13px;background:var(--surface);max-width:720px}
.empty-panel .icon{color:var(--accent);width:31px;height:31px}
.empty-panel b{display:block;font-size:18px;margin:15px 0 5px}
.empty-panel p{margin:0;color:var(--muted);font-size:13px}
@media(max-width:1240px){.home-grid{grid-template-columns:minmax(330px,1fr) minmax(450px,1.15fr);gap:34px}.feature{padding:20px}.feature h2{font-size:30px}.intro h1{font-size:65px}}
@media(max-width:990px){.home-grid{grid-template-columns:1fr}.intro{min-height:auto;padding-bottom:20px}.intro h1{font-size:clamp(55px,8vw,80px)}.intro::before{inset:0 0 0 -20px}.features{min-height:430px}.home-screen{padding-top:33px}}
@media(max-width:720px){
 .app{margin-right:0;padding-bottom:88px}.container{padding-left:19px;padding-right:19px}
 .topbar{min-height:80px}.brand-title{font-size:13px}.top-hint{display:none}
 .rail,.rail:hover,.rail:focus-within,.rail.expanded{inset:auto 0 0 0;width:100%;height:74px;flex-direction:row;align-items:center;padding:6px 5px calc(6px + env(safe-area-inset-bottom,0px));gap:0;border-left:0;border-top:1px solid var(--line);overflow:visible;box-shadow:0 -8px 28px rgba(0,0,0,.12)}
 .rail-top{display:none}.rail-nav{margin:0;display:flex;flex-direction:row;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
 .rail-nav::-webkit-scrollbar{display:none}
 .rail-button{min-width:64px;width:64px;height:58px;padding:7px 3px 4px;flex-direction:column;align-items:center;justify-content:center;gap:4px}
 .rail-button .icon{width:21px;height:21px}.rail-button span,.rail:hover .rail-button span,.rail:focus-within .rail-button span{opacity:1;max-width:60px;line-height:1;font-size:9px;white-space:nowrap;text-align:center;text-overflow:ellipsis}
 .rail-bottom{margin:0;padding:0 0 0 6px;border:0;border-left:1px solid var(--line)}
 .theme-toggle{width:48px;height:50px;display:grid;place-items:center;padding:0}
 .theme-toggle .icon{width:21px;height:21px}.rail-bottom small,.theme-toggle span{display:none!important}
 .intro h1{font-size:clamp(46px,11vw,66px)}.intro-desc{font-size:15px}.home-screen{padding-bottom:40px}
 .subpage{padding-top:36px;padding-bottom:70px}
}
@media(max-width:520px){.features{grid-template-columns:1fr;grid-template-rows:none;min-height:auto}.feature,.feature-situations{min-height:190px;grid-row:auto}.feature-situations{min-height:235px}.feature h2{font-size:29px}.intro h1{font-size:clamp(44px,11vw,62px)}.search{gap:7px;padding-left:10px}.search button{min-width:70px;padding:11px 12px}.eyebrow{font-size:10px;letter-spacing:.15em}.brand-mark{width:33px;height:33px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* V3 · UI finish: right-hand rail, high-quality consistent icons, soft materiality. */
:root {
 --ease-ui:cubic-bezier(.2,.78,.22,1);
 --ease-spring:cubic-bezier(.16,1,.3,1);
 --micro:180ms;
 --smooth:320ms;
 --surface-highlight:rgba(154,200,237,.035);
}
html[data-theme="light"]{--surface-highlight:rgba(48,101,145,.027)}
body,button,input {font-family:'Onest','Segoe UI',system-ui,-apple-system,sans-serif}
body {letter-spacing:-.012em;transition:background-color .36s var(--ease-ui),color .32s var(--ease-ui)}
.icon{stroke-width:1.85;shape-rendering:geometricPrecision;transition:transform .32s var(--ease-spring),color .25s var(--ease-ui)}
/* Left nav: narrow icon column, expands to the right on hover. */

 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border-right:1px solid var(--line);border-left:0;
 transition:width .42s var(--ease-spring),background-color .3s var(--ease-ui),box-shadow .3s var(--ease-ui);
}
.rail:hover,.rail:focus-within,.rail.expanded{width:250px;box-shadow:18px 2px 60px rgba(0,0,0,.20)}
.rail-top{display:none !important}
.rail-nav{gap:5px;margin-top:0}
.rail-button,.theme-toggle{
 position:relative;gap:16px;height:54px;
 padding:0 10px;border-radius:15px;
 font-size:13px;font-weight:650;
 transition:background-color .25s var(--ease-ui),border-color .25s var(--ease-ui),color .25s var(--ease-ui),transform .3s var(--ease-spring);
}
.rail-button>.icon,.theme-toggle>.icon{width:22px;height:22px;box-sizing:content-box;flex:0 0 22px;padding:0;border-radius:0;background:transparent;border:0}
.rail-button:hover,.theme-toggle:hover{transform:none;background:var(--accent-wash)}

.rail-button.active{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent-strong) 30%,var(--line));color:var(--accent-strong)}
.rail-button.active::after{content:'';position:absolute;left:-11px;top:15px;bottom:15px;width:3px;background:var(--accent-strong);border-radius:0 3px 3px 0}
.rail-button.active>.icon{color:var(--accent-strong);border-color:color-mix(in srgb,var(--accent-strong) 35%,var(--line));background:color-mix(in srgb,var(--accent-wash) 75%,var(--surface2))}
.rail-button span,.theme-toggle span{transition:opacity .27s var(--ease-ui),transform .33s var(--ease-spring);transform:translateX(8px)}
.rail:hover .rail-button span,.rail:hover .theme-toggle span,.rail:focus-within .rail-button span,.rail:focus-within .theme-toggle span,.rail.expanded .rail-button span,.rail.expanded .theme-toggle span{transform:translateX(0)}
.rail-bottom{padding-top:14px;margin-top:auto}

/* Администрирование и статьи из API */
.admin-link{margin-top:22px;display:inline-flex;align-items:center;gap:11px;padding:11px 15px;border:1px solid var(--line);background:var(--surface);border-radius:14px;color:var(--muted);font-size:13px;font-weight:650;text-decoration:none;transition:background .25s,border-color .25s,color .25s}
.admin-link .icon{width:17px;height:17px}.admin-link .icon:last-child{width:14px;height:14px;opacity:.65}.admin-link:hover{border-color:var(--line-hover);color:var(--text);background:var(--surface2)}
.material-list{display:grid;gap:10px;margin-top:36px}.material-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}.material-card[open]{border-color:var(--line-hover)}
.material-card summary{list-style:none;padding:20px 24px;cursor:pointer;font-weight:700;font-size:16px}.material-card summary::-webkit-details-marker{display:none}.material-card summary::after{content:'+';float:right;font-size:22px;line-height:1;color:var(--accent)}.material-card[open] summary::after{content:'−'}
.material-body{padding:0 24px 23px;border-top:1px solid var(--line)}.material-summary{color:var(--muted);font-size:13px}.material-text{padding-top:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.72}.material-source{display:inline-block;margin-top:16px;color:var(--accent-strong);font-size:13px}
@media(max-width:520px){.material-card summary{padding:16px 18px}.material-body{padding:0 18px 18px}}
</style>
</head>
<body>

 <symbol id="i-message" viewBox="0 0 24 24"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7A2.5 2.5 0 0 1 16.5 16H10l-4 4v-4.5A2.5 2.5 0 0 1 5 13V6.5Z"/><path d="M8 8.5h8M8 11.5h6"/></symbol>

 <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 4h6"/><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 9h8M8 13h8M8 17h6"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
 <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>

 <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

<aside class="rail" id="rail" aria-label="Разделы памятки">
 <nav class="rail-nav" aria-label="Навигация">
  <button class="rail-button active" data-page="home" aria-label="Главная" title="Главная"><svg class="icon"><use href="#i-home"/></svg><span>Главная</span></button>
  <button class="rail-button" data-page="situations" aria-label="Ситуации" title="Ситуации"><svg class="icon"><use href="#i-message"/></svg><span>Ситуации</span></button>
  <button class="rail-button" data-page="reference" aria-label="Правовой справочник" title="Правовой справочник"><svg class="icon"><use href="#i-scale"/></svg><span>Правовой справочник</span></button>
  <button class="rail-button" data-page="detention" aria-label="Порядок задержания" title="Порядок задержания"><svg class="icon"><use href="#i-list"/></svg><span>Порядок задержания</span></button>
  <button class="rail-button" data-page="laws" aria-label="Законодательство" title="Законодательство"><svg class="icon"><use href="#i-book"/></svg><span>Законодательство</span></button>
 </nav>
 <div class="rail-bottom">
  <button class="theme-toggle rail-theme" id="theme-toggle" aria-label="Включить светлую тему" title="Переключить тему"><svg class="icon sun"><use href="#i-sun"/></svg><svg class="icon moon"><use href="#i-moon"/></svg><span id="theme-label">Светлая тема</span></button>
 </div>
</aside>
<div class="app">
 <header class="container topbar">
  <div class="brand"><span class="brand-mark" id="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-shield"/></svg></span><span class="brand-title">ФСО / RMRP — Тверской</span></div>
 </header>
 <main class="container">
  <section class="home-screen" id="home-screen" aria-labelledby="home-title">
   <div class="home-grid">
    <div class="intro">
     <div class="eyebrow">Служебная памятка</div>
     <h1 id="home-title">Памятка<br><strong>сотрудника.</strong></h1>
     <p class="intro-desc">Материалы для сотрудников ФСО Тверского сервера.</p>
     <form class="search" id="section-search-form" role="search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="visually-hidden" for="section-search">Поиск раздела</label>
      <input id="section-search" autocomplete="off" placeholder="Название раздела…">
      <button type="submit">Найти</button>
     </form>
     <div class="search-hint" id="search-hint" aria-live="polite">Поиск по разделам памятки.</div>
     <div class="search-results" id="search-results" hidden></div>
     <a class="admin-link" href="./admin.html"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><span>Админ-панель</span><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
    <div class="features" aria-label="Основные разделы">
     <button class="feature feature-situations" data-page="situations"><span class="number">01</span><h2>Ситуации</h2><p>Действия сотрудника в различных ситуациях.</p><span class="arrow">Открыть <svg class="icon"><use href="#i-arrow"/></svg></span><span class="ghost-number" aria-hidden="true">01</span></button>
     <button class="feature feature-reference" data-page="reference"><span class="number">02</span><h2>Правовой<br>справочник</h2><p>Статьи и пояснения.</p><span class="arrow">Открыть <svg class="icon"><use href="#i-arrow"/></svg></span></button>
     <button class="feature feature-detention" data-page="detention"><span class="number">03</span><h2>Порядок<br>задержания</h2><p>Последовательность действий.</p><span class="arrow">Открыть <svg class="icon"><use href="#i-arrow"/></svg></span></button>
    </div>
   </div>
  </section>
  <section class="subpage" id="section-screen" hidden aria-live="polite">
   <button class="back" data-page="home">← На главную</button>
   <h1 id="section-title">Раздел</h1>
   <p class="subpage-desc" id="section-description"></p>
   <div class="material-list" id="material-list" hidden></div><div class="empty-panel" id="empty-panel"><svg class="icon"><use href="#i-file"/></svg><b>Материалы пока не добавлены</b></div>
  </section>
 </main>
</div>
<script src="./config.js"></script>
<script>
'use strict';
const sections={
 home:{title:'Главная',keys:[]},
 situations:{title:'Ситуации',description:'Служебные ситуации и действия сотрудника.',keys:['сценарии','ситуация']},
 reference:{title:'Правовой справочник',description:'Правовые основания и краткие пояснения.',keys:['статьи','основания','справочник']},
 detention:{title:'Порядок задержания',description:'Порядок и основания задержания.',keys:['задержание','процедуры']},
 laws:{title:'Законодательство',description:'Законы и кодексы проекта.',keys:['законы','кодексы']}
};
const $=id=>document.getElementById(id);
let publicMaterials=[];
const nav=$('rail').querySelector('.rail-nav');
function renderMaterials(page){
 const items=publicMaterials.filter(x=>x.sectionId===page),wrap=$('material-list');
 wrap.replaceChildren();wrap.hidden=items.length===0;$('empty-panel').hidden=items.length!==0;
 items.forEach(x=>{
  const article=document.createElement('details');article.className='material-card';
  const summary=document.createElement('summary');summary.textContent=x.title;article.append(summary);
  const inner=document.createElement('div');inner.className='material-body';
  if(x.summary){const teaser=document.createElement('p');teaser.className='material-summary';teaser.textContent=x.summary;inner.append(teaser)}
  const body=document.createElement('div');body.className='material-text';body.textContent=x.body||'';inner.append(body);
  if(x.sourceUrl && /^https:\/\//i.test(x.sourceUrl)){
   const link=document.createElement('a');link.href=x.sourceUrl;link.target='_blank';link.rel='noopener noreferrer';link.className='material-source';link.textContent='Источник';inner.append(link)
  }
  article.append(inner);wrap.append(article);
 });
}
async function loadPublic(){
 const url=(window.FSO_API_URL||'').trim();if(!/^https:\/\//.test(url))return;
 try{
  const response=await fetch(url+'?action=public',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const info=await response.json();if(!info.ok)throw new Error(info.error||'API');
  publicMaterials=Array.isArray(info.items)?info.items:[];
  const allowed=new Set(), homeButton=nav.querySelector('[data-page="home"]');
  const sorted=[...(info.sections||[])].filter(s=>s.visible).sort((a,b)=>a.order-b.order);
  for(const item of sorted){
   if(!item.id || !/^[a-z0-9-]{1,80}$/.test(item.id))continue;
   const existing=sections[item.id];
   sections[item.id]={title:item.title,description:item.description||'',keys:existing?.keys||[]};
   let button=nav.querySelector('[data-page="'+item.id+'"]');
   if(!button){button=document.createElement('button');button.className='rail-button';button.dataset.page=item.id;const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('class','icon');icon.setAttribute('aria-hidden','true');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#i-file');icon.append(use);button.append(icon);const label=document.createElement('span');button.append(label)}
   button.querySelector('span').textContent=item.title;button.setAttribute('aria-label',item.title);button.title=item.title;
   nav.append(button);allowed.add(item.id);
  }
  for(const button of [...nav.querySelectorAll('[data-page]')]){if(button.dataset.page!=='home'&&!allowed.has(button.dataset.page)){button.remove();delete sections[button.dataset.page]}}
  if(homeButton)nav.prepend(homeButton);
  document.querySelectorAll('.feature[data-page]').forEach(el=>{el.hidden=!allowed.has(el.dataset.page)});
  const page=decodeURIComponent(location.hash.slice(1))||'home';go(page);
 }catch(e){console.warn('Не удалось загрузить материалы памятки:',e.message)}
}
const themeKey='fso-rmrp-theme';
function applyTheme(theme){
 const choice=theme==='light'?'light':'dark';
 document.documentElement.dataset.theme=choice;
 $('theme-meta').content=choice==='light'?'#eef3f8':'#0d1219';
 $('theme-toggle').setAttribute('aria-label',choice==='dark'?'Включить светлую тему':'Включить тёмную тему');
 $('theme-label').textContent=choice==='dark'?'Светлая тема':'Тёмная тема';
 try{localStorage.setItem(themeKey,choice)}catch(e){}
}
let savedTheme='dark';
try{savedTheme=localStorage.getItem(themeKey)||'dark'}catch(e){}
applyTheme(savedTheme);
$('theme-toggle').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
// Логотип не обязателен: если файла нет, отображается встроенный значок щита.
const probe=new Image();probe.onload=()=>{$('brand-mark').classList.add('has-image')};probe.src='./assets/logo.png';
function go(page){
 if(!Object.prototype.hasOwnProperty.call(sections,page))page='home';
 const home=page==='home';
 $('home-screen').hidden=!home;$('section-screen').hidden=home;
 if(!home){$('section-title').textContent=sections[page].title;$('section-description').textContent=sections[page].description;renderMaterials(page)}
 document.querySelectorAll('[data-page]').forEach(el=>{
  const active=el.dataset.page===page;
  el.classList.toggle('active',active);
  if(el.classList.contains('rail-button')){if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')}
 });
 if(location.hash!=='#'+page)history.replaceState(null,'','#'+page);
 document.title=(home?'ФСО / RMRP — Тверской':sections[page].title+' — ФСО / RMRP');
 window.scrollTo({top:0,behavior:'instant'});
 $('search-results').hidden=true;
}
document.addEventListener('click',event=>{const button=event.target.closest('[data-page]');if(button)go(button.dataset.page)});
function matchingSections(query){
 const q=query.trim().toLocaleLowerCase('ru-RU');
 if(!q)return[];
 return Object.keys(sections).filter(id=>id!=='home'&&[sections[id].title,...sections[id].keys].some(x=>x.toLocaleLowerCase('ru-RU').includes(q)));
}
function showSearchResults(){
 const items=matchingSections($('section-search').value),panel=$('search-results');
 panel.replaceChildren();
 if(!items.length){panel.hidden=true;$('search-hint').textContent=$('section-search').value.trim()?'Раздел не найден.':'Поиск по разделам памятки.';return}
 if(items.length===1){$('search-hint').textContent='Найден 1 раздел.'}else{$('search-hint').textContent=`Найдено разделов: ${items.length}.`}
 items.forEach(id=>{const b=document.createElement('button');b.type='button';b.dataset.page=id;b.textContent=sections[id].title;panel.append(b)});
 panel.hidden=false;
}
$('section-search').addEventListener('input',showSearchResults);
$('section-search-form').addEventListener('submit',event=>{
 event.preventDefault();const items=matchingSections($('section-search').value);
 if(items.length===1)go(items[0]);else{showSearchResults();if(!items.length)$('section-search').focus()}
});
document.addEventListener('keydown',event=>{
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){
  event.preventDefault();go('home');$('section-search').focus();$('section-search').scrollIntoView({block:'center',behavior:'smooth'});
 }
 if(event.key==='Escape'&&document.activeElement===$('section-search')){$('section-search').blur();$('search-results').hidden=true}
});
window.addEventListener('hashchange',()=>go(decodeURIComponent(location.hash.slice(1))));
go(decodeURIComponent(location.hash.slice(1))||'home');
loadPublic();



</script>
</body>
</html>
